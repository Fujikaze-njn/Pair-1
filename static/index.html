<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Tech - WhatsApp Pair</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('./nexus.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #00d4aa, #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 0 30px rgba(0, 212, 170, 0.3);
        }

        .logo p {
            color: #b0b0b0;
            font-size: 1.1em;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
            font-weight: 500;
            color: #e0e0e0;
        }

        #number {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        #number::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        #number:focus {
            border-color: #00d4aa;
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        #pairBtn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00d4aa, #00a8ff);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        #pairBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        #pairBtn:hover::before {
            left: 100%;
        }

        #pairBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 170, 0.4);
        }

        #pairBtn:active {
            transform: translateY(0);
        }

        #pairBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .code-container {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border-left: 4px solid #00d4aa;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #code {
            font-size: 1.3em;
            font-weight: 600;
            color: #00d4aa;
            margin: 10px 0;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00d4aa;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #b0b0b0;
            font-size: 0.9em;
        }

        .whatsapp-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            background: linear-gradient(45deg, #25D366, #128C7E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
            }
            
            .logo h1 {
                font-size: 2em;
            }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(0, 212, 170, 0.6);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="logo">
            <h1>NEXUS TECH</h1>
            <p>Advanced WhatsApp Integration</p>
        </div>

        <div class="whatsapp-icon">📱</div>

        <div class="form-group">
            <label for="number">Phone Number</label>
            <input type="tel" id="number" placeholder="234567890123" maxlength="20">
        </div>

        <button id="pairBtn">
            <span id="btnText">Generate Pair Code</span>
        </button>

        <div class="code-container" id="codeContainer">
            <h3>Your Pair Code:</h3>
            <div id="code"></div>
            <p style="font-size: 0.9em; color: #b0b0b0; margin-top: 10px;">
                Enter this code in WhatsApp Web to connect
            </p>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            
            setInterval(() => {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                
                particlesContainer.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 6000);
            }, 300);
        }

        // Phone number input - only allow numbers, no formatting
        document.getElementById('number').addEventListener('input', function(e) {
            // Remove all non-digit characters
            let value = e.target.value.replace(/\D/g, '');
            
            // Limit to reasonable phone number length
            if (value.length > 15) {
                value = value.slice(0, 15);
            }
            
            e.target.value = value;
        });

        // Pair button functionality
        document.getElementById('pairBtn').addEventListener('click', async () => {
            const num = document.getElementById('number').value;
            const btn = document.getElementById('pairBtn');
            const btnText = document.getElementById('btnText');
            const codeContainer = document.getElementById('codeContainer');
            const codeElement = document.getElementById('code');
            
            // Validate phone number (must be at least 10 digits)
            if (!num || num.length < 10) {
                alert('Please enter a valid phone number (at least 10 digits)');
                return;
            }
            
            // Show loading state
            btn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span>Generating Code...';
            codeContainer.style.display = 'none';
            
            try {
                // Send the raw number without any formatting
                const res = await fetch(`/pair?code=${encodeURIComponent(num)}`);
                const data = await res.json();
                
                if(data.code) {
                    codeElement.textContent = `Pairing code: ${data.code}`;
                    btnText.textContent = 'Code Generated Successfully!';
                } else {
                    codeElement.textContent = `Error: ${data.error || data.message}`;
                    btnText.textContent = 'Try Again';
                }
                
                codeContainer.style.display = 'block';
                
                // Reset button after 3 seconds
                setTimeout(() => {
                    btn.disabled = false;
                    btnText.textContent = 'Generate New Code';
                }, 3000);
                
            } catch (error) {
                codeElement.textContent = `Error: Failed to connect to server`;
                codeContainer.style.display = 'block';
                btn.disabled = false;
                btnText.textContent = 'Generate Pair Code';
            }
        });

        // Initialize particles
        createParticles();

        // Add some interactive effects
        document.addEventListener('mousemove', function(e) {
            const container = document.querySelector('.container');
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            container.style.transform = `perspective(1000px) rotateX(${y / 50}deg) rotateY(${x / 50}deg)`;
        });

        document.addEventListener('mouseleave', function() {
            document.querySelector('.container').style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
        });
    </script>
</body>
</html>
